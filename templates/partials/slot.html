<div class="slot slot--{{id}}" data-slot="{{id}}">
  <a class="slot-link" href="#slot-{{id}}" aria-label="{{name}}：{{count}} 件，在裝備清單裡篩選">
    <svg class="silhouette" viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-{{id}}"></use></svg>
    <span class="tape">{{name}}</span>
  </a>
  <ul class="hung">{{hung}}</ul>
</div>
